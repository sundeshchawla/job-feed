name: Fetch jobs

on:
  schedule:
    - cron: "20 23 * * *"   # 04:50 IST, before the 05:46 desk import
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["feed/**", ".github/workflows/fetch.yml"]

permissions:
  contents: write

concurrency:
  group: fetch-jobs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and score jobs
        run: python feed/fetch.py
      - name: Commit results
        run: |
          git config user.name "job-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out feed/ats_cache.json feed/state.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "feed: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push origin HEAD:main
